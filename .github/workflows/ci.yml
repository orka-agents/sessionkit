name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make vet test
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install pinned native client
        run: echo "SESSIONKIT_CODEX_BIN=$(./scripts/install-codex.sh)" >> "$GITHUB_ENV"
      - name: Install SQLite read-only test dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - run: make native-gate
